name: approvex

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: approvex
      POSTGRES_PASSWORD: approvex
      POSTGRES_DB: approvex
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U approvex -d approvex']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: api
    environment:
      DATABASE_URL: postgresql://approvex:approvex@postgres:5432/approvex?schema=public
      APP_DATABASE_URL: postgresql://approvex_app:approvex_app@postgres:5432/approvex?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 3000
      JWT_ACCESS_SECRET: dev-access-secret
      JWT_REFRESH_SECRET: dev-refresh-secret
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: worker
    environment:
      DATABASE_URL: postgresql://approvex:approvex@postgres:5432/approvex?schema=public
      APP_DATABASE_URL: postgresql://approvex_app:approvex_app@postgres:5432/approvex?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: web
    environment:
      API_PROXY_TARGET: http://api:3000
    ports:
      - '5173:5173'
    depends_on:
      - api

volumes:
  pgdata:
