packages:
  - apps/*
  - packages/*

# Single source of truth for every version used by more than one package.
# Packages reference these as `"typescript": "catalog:"` — bump here, once.
#
# @prisma/client / prisma are pinned EXACTLY (no ^): apps/worker reuses the
# client generated by apps/api, which only works while both resolve to the
# same version. The catalog makes that invariant structural instead of a
# comment someone has to remember.
catalog:
  '@prisma/client': 6.19.3
  prisma: 6.19.3
  '@types/node': ^22.10.7
  ioredis: ^5.11.1
  tsx: ^4.19.2
  typescript: ^5.7.3
  vitest: ^3.0.4
