services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: api
    restart: unless-stopped
    expose: ["3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://approvex_app:${APPROVEX_DB_PASSWORD}@postgres:5432/approvex
      REDIS_URL: redis://redis:6379/0
      APPROVEX_DOMAIN: ${APPROVEX_DOMAIN}
      API_PUBLIC_URL: https://${APPROVEX_DOMAIN}
      WEB_APP_URL: https://${APPROVEX_DOMAIN}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      RATE_LIMIT_RPM: 300
    command: sh -c "npx prisma migrate deploy && node apps/api/dist/main.js"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: worker
    restart: unless-stopped
    depends_on:
      api: { condition: service_started }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://approvex_app:${APPROVEX_DB_PASSWORD}@postgres:5432/approvex
      REDIS_URL: redis://redis:6379/0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    command: node apps/worker/dist/main.js

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    expose: ["80"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    hostname: approvex-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [default, shared-data]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    hostname: approvex-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [default, shared-data]

networks:
  default: {}
  shared-data:
    external: true

volumes:
  pgdata:
  redisdata: