services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: api
    restart: unless-stopped
    expose: ["3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      MIGRATEDATABASE_URL: postgres://approvex_app:acac7b2f59b0d21d5f1e4bda42ea3fcc81c8414eba7874c454958d6c7ee14476@postgres:5432/approvex
      DATABASE_URL: postgres://approvex:OWNER_PASSWORD@postgres:5432/approvex
      APP_DATABASE_URL: postgres://approvex_app:3886ec8e3fa369dccf7fb54c35b7dfb47def4cbedd8a12f5ae5b4b44b49d151b@postgres:5432/approvex

      REDIS_URL: redis://redis:6379/0
      APPROVEX_DOMAIN: ${APPROVEX_DOMAIN}
      API_PUBLIC_URL: https://${APPROVEX_DOMAIN}
      WEB_APP_URL: https://${APPROVEX_DOMAIN}
      JWT_ACCESS_SECRET: 90eafce0c0548868d5bab20fb1ba82a648917d6e52ce7a9d085792278dd758f8
      JWT_REFRESH_SECRET: ba8d3c636799015ba135abcde67fba0059983d79b94fb7a2c9bee49c50691b7a
      RATE_LIMIT_RPM: 300
    command: sh -c "DATABASE_URL='postgres://approvex:OWNER_PASSWORD@postgres:5432/approvex' pnpm --filter @approvex/api exec prisma migrate deploy && node apps/api/dist/main.js"
  worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: worker
    restart: unless-stopped
    depends_on:
      api: { condition: service_started }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://approvex_app:3886ec8e3fa369dccf7fb54c35b7dfb47def4cbedd8a12f5ae5b4b44b49d151b@postgres:5432/approvex
      REDIS_URL: redis://redis:6379/0
      JWT_ACCESS_SECRET: 90eafce0c0548868d5bab20fb1ba82a648917d6e52ce7a9d085792278dd758f8
      JWT_REFRESH_SECRET: ba8d3c636799015ba135abcde67fba0059983d79b94fb7a2c9bee49c50691b7a
    command: node apps/worker/dist/main.js

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    expose: ["80"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    hostname: approvex-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 90e2e45eafe13dbdb68220c0769f84c2512f9afcfd7296263f696b4c23302b50
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [default, shared-data]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    hostname: approvex-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [default, shared-data]

networks:
  default: {}
  shared-data:
    external: true

volumes:
  pgdata:
  redisdata: