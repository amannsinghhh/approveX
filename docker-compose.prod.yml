# Coolify production services for ApproveX.
#
# Postgres + Redis are SHARED, Coolify-managed services (NOT defined here). TLS
# and routing are handled by Coolify's proxy (no Caddy). The web SPA deploys
# separately as a Coolify static site (apps/web/dist) at approvals.<domain>,
# with this API mounted at approvals.<domain>/api.
#
# Set all secrets, DATABASE_URL, REDIS_URL and APPROVEX_DOMAIN in the Coolify UI.
name: approvex-prod

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: api
    restart: unless-stopped
    expose:
      - "3000"                     # Coolify routes /api/* to this internal port
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in Coolify (shared Postgres)}
      APP_DATABASE_URL: ${APP_DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in Coolify (shared Redis)}
      PORT: 3000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in Coolify}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in Coolify}
      API_PUBLIC_URL: https://${APPROVEX_DOMAIN}
      WEB_APP_URL: https://${APPROVEX_DOMAIN}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-300}
      SENTRY_DSN: ${SENTRY_DSN:-}
      OIDC_GOOGLE_CLIENT_ID: ${OIDC_GOOGLE_CLIENT_ID:-}
      OIDC_GOOGLE_CLIENT_SECRET: ${OIDC_GOOGLE_CLIENT_SECRET:-}
      OIDC_MICROSOFT_CLIENT_ID: ${OIDC_MICROSOFT_CLIENT_ID:-}
      OIDC_MICROSOFT_CLIENT_SECRET: ${OIDC_MICROSOFT_CLIENT_SECRET:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: worker
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in Coolify (shared Postgres)}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in Coolify (shared Redis)}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
