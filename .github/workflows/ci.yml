name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: approvex
          POSTGRES_PASSWORD: approvex
          POSTGRES_DB: approvex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U approvex -d approvex"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://approvex:approvex@localhost:5432/approvex?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Prisma schema valid
        run: pnpm prisma:validate

      - name: Prisma migrations in sync with schema
        run: >
          pnpm exec prisma migrate diff
          --from-migrations apps/api/prisma/migrations
          --to-schema-datamodel apps/api/prisma/schema.prisma
          --shadow-database-url "$DATABASE_URL"
          --exit-code
